[project]
name = "posprint"
version = "1.0.0"
description = "HTTP service for a USB-attached ESC/POS receipt printer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
]

[project.scripts]
posprint = "posprint.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["posprint*"]

# Two services live here: the printer driver at the root, and the public web
# front end under web/. They deploy independently and have separate
# requirements; this config only exists so `pytest` from the root runs both.
#
# pythonpath puts both package roots on sys.path, so no PYTHONPATH is needed.
# importlib import mode is required because each service has its own
# tests/test_api.py, and the default mode cannot tell two same-named test
# modules apart without __init__.py files.
[tool.pytest.ini_options]
testpaths = ["tests", "web/tests"]
pythonpath = [".", "web"]
addopts = "--import-mode=importlib"
