# Drop-in installed at /etc/systemd/system/posprint.service.d/10-container.conf
# when install.sh detects it is running inside a container.
#
# The hardening directives below all require systemd to build a private mount
# namespace for the unit. An unprivileged LXC cannot do that - the attempt dies
# with:
#
#   Failed to set up mount namespacing: /run/systemd/unit-root/proc: Permission denied
#   Failed at step NAMESPACE spawning ...: Permission denied
#   status=226/NAMESPACE
#
# Enabling `nesting=1` on the container would make them work, but that is the
# wrong trade: it loosens the container's own isolation to buy in-container
# hardening that duplicates what the container already gives you. This is a
# single-purpose unprivileged LXC running one non-root service with an empty
# capability set, so the container is the security boundary.
#
# Everything not listed here stays in force - NoNewPrivileges, the empty
# CapabilityBoundingSet, and every seccomp-based restriction work fine without
# a mount namespace.

[Service]
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
ProtectKernelTunables=no
ProtectControlGroups=no
ProtectHostname=no
