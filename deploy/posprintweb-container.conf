[Service]
# Dropped in by install.sh when running inside an unprivileged LXC, where
# systemd cannot set up a private mount namespace and the unit would otherwise
# fail with 226/NAMESPACE. Everything else in posprintweb.service still applies.
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
PrivateDevices=no
ProtectKernelTunables=no
ProtectControlGroups=no
ProtectHostname=no
ProtectProc=default
