<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — things people printed</title>
<meta name="description" content="Messages strangers sent to a real thermal receipt printer.">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧾</text></svg>">
</head>
<body class="page--wall">
<main>
  <nav class="nav" aria-label="Sections">
    <a href="/" class="nav__link">Print</a>
    <a href="/gallery" class="nav__link nav__link--current" aria-current="page">Gallery</a>
    <a class="nav__link nav__link--source"
       href="https://github.com/tomgroenwoldt/posprint"
       target="_blank" rel="noopener noreferrer"
       title="Source code on GitHub">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      <span>Source</span>
    </a>
  </nav>

  <header>
    <h1>Gallery</h1>
    <p class="blurb">Things people sent to the printer, that I liked enough to
       keep. Everything here was picked by hand.</p>
  </header>

  <p class="filter" id="filter" hidden>
    <label class="filter__label" for="day">Showing</label>
    <select class="filter__select" id="day"></select>
    <span class="filter__count" id="shown"></span>
  </p>

  <p id="empty" class="muted" hidden>Nothing here yet.</p>

  <ul id="entries" class="gallery gallery--wall"></ul>

  <p class="gallery__more">
    <button id="more" type="button" hidden>Show older</button>
  </p>

  <footer>
    <p class="muted">Only approved messages appear here, so this is not
       everything that gets printed.</p>
  </footer>
</main>
<script src="/static/receipt.js"></script>
<script src="/static/gallery.js"></script>
</body>
</html>
